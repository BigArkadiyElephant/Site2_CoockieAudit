// ============ ANIMATED NUMBER ============
function AnimatedNumber({ value, format = (v) => Math.round(v).toLocaleString('ru-RU'), duration = 600, className = '' }) {
  const [display, setDisplay] = useState(value);
  const prevRef = useRef(value);
  const rafRef = useRef(null);

  useEffect(() => {
    const start = prevRef.current; const end = value;
    if (start === end) { setDisplay(end); return; }
    const startTime = performance.now();
    const tick = (now) => {
      const t = Math.min(1, (now - startTime) / duration);
      const eased = 1 - Math.pow(1 - t, 3);
      const current = start + (end - start) * eased;
      setDisplay(current);
      if (t < 1) rafRef.current = requestAnimationFrame(tick);
      else prevRef.current = end;
    };
    rafRef.current = requestAnimationFrame(tick);
    return () => cancelAnimationFrame(rafRef.current);
  }, [value, duration]);

  return <span className={className}>{format(display)}</span>;
}

      {active && <span className="absolute left-0 top-2 bottom-2 w-0.5 rounded-r-full bg-gradient-to-b from-indigo-400 to-pink-400"></span>}
      {icon}
      <span className="flex-1 text-left font-medium whitespace-nowrap">{label}</span>

        <span className={`text-[10px] font-mono px-1.5 py-0.5 rounded-md ${active ? 'bg-white/10' : 'bg-white/5 text-zinc-500'}`}>

// ============ NUMERIC INPUT ============
function NumInput({ label, value, onChange, suffix='', placeholder='0', warning=false, hint }) {
  const [focused, setFocused] = useState(false);
  return (
    <label className="block">
      <div className="flex items-center justify-between mb-1.5">
        <span className="text-xs text-zinc-400">{label}</span>
        {hint && <span className="text-[10px] text-zinc-600">{hint}</span>}
      </div>
      <div className={`relative flex items-center rounded-xl border transition-all ${
        warning
          ? 'border-rose-500/50 bg-rose-500/5'
          : focused
            ? 'border-indigo-400/60 bg-white/[0.04]'
            : 'border-white/10 bg-white/[0.03] hover:bg-white/[0.05]'
      }`}
      style={warning ? {boxShadow:'0 0 0 3px rgba(244,63,94,0.08)'} : focused ? {boxShadow:'0 0 0 3px rgba(99,102,241,0.1)'} : {}}>
        <input type="number"
          value={value === 0 ? '' : value}
          onChange={(e) => onChange(e.target.value === '' ? 0 : Number(e.target.value))}
          onFocus={() => setFocused(true)} onBlur={() => setFocused(false)}
          placeholder={placeholder}
          className="w-full bg-transparent px-3.5 py-2.5 text-sm font-mono outline-none placeholder:text-zinc-600" />
        {suffix && <span className="pr-3.5 text-xs text-zinc-500 font-mono">{suffix}</span>}
        {warning && (
          <div className="absolute -top-1.5 right-3 px-2 py-0.5 rounded-md bg-rose-500/90 text-[9px] text-white font-medium uppercase tracking-wider">
            вне нормы
          </div>
        )}
      </div>
    </label>
  );
}

// ============ LIVE PREVIEW ============
function LivePreview({ data, concept }) {
  const radarData = useMemo(() => {
    if (!concept) return [];
    const score = (actual, [lo, hi]) => {
      if (actual <= 0) return 0;
      if (actual <= lo) return 100;
      if (actual <= hi) return 100 - ((actual - lo) / (hi - lo)) * 30;
      return Math.max(0, 70 - (actual - hi) * 5);
    };
    return [
      { metric: 'Фудкост', actual: score(data.foodCost, concept.benchmarks.foodCost), bench: 85 },
      { metric: 'Лейбор', actual: score(data.laborCost, concept.benchmarks.laborCost), bench: 85 },
      { metric: 'Напитки', actual: score(data.drinkCost, concept.benchmarks.drinkCost), bench: 85 },
      { metric: 'Списания', actual: data.wastage > 0 ? Math.max(0, 100 - data.wastage * 12) : 0, bench: 85 },
      { metric: 'Инвент.', actual: data.inventoryGap > 0 ? Math.max(0, 100 - data.inventoryGap * 25) : 0, bench: 85 },
    ];
  }, [data, concept]);

  const barData = useMemo(() => {
    if (!concept) return [];
    return [
      { name: 'FC', value: data.foodCost, mid: (concept.benchmarks.foodCost[0] + concept.benchmarks.foodCost[1]) / 2 },
      { name: 'LC', value: data.laborCost, mid: (concept.benchmarks.laborCost[0] + concept.benchmarks.laborCost[1]) / 2 },
      { name: 'DC', value: data.drinkCost, mid: (concept.benchmarks.drinkCost[0] + concept.benchmarks.drinkCost[1]) / 2 },
      { name: 'Аренда', value: data.rent, mid: 12 },
    ];
  }, [data, concept]);

  const estProfit = useMemo(() => {
    if (!data.revenue) return 0;
    const totalCost = (data.foodCost + data.laborCost + (data.rent || 12) + (data.drinkCost * 0.2)) / 100;
    return Math.max(0, data.revenue * (1 - totalCost));
  }, [data]);

  return (
    <div className="rounded-2xl border border-white/10 backdrop-blur-sm p-5 sticky top-4"
      style={{ background:'linear-gradient(135deg, rgba(255,255,255,0.04), rgba(255,255,255,0.01))' }}>
      <div className="flex items-center justify-between mb-1">
        <div className="flex items-center gap-2">
          <span className="w-1.5 h-1.5 rounded-full bg-emerald-400" style={{boxShadow:'0 0 8px #34d399', animation:'pulse 2s infinite'}}></span>
          <span className="text-[11px] uppercase tracking-wider text-zinc-500 font-medium">Live preview</span>
        </div>
        <span className="text-[10px] text-zinc-600 font-mono">realtime</span>
      </div>

      {!concept ? (
        <div className="py-12 text-center text-zinc-600 text-sm">
          <div className="grid place-items-center mb-3 opacity-30"><I.Activity size={28} stroke={1.25}/></div>
          Выберите концепцию,<br/>чтобы увидеть превью
        </div>
      ) : (
        <>
          <div className="my-3 pb-4 border-b border-white/5">
            <div className="text-[11px] text-zinc-500 mb-1">Расчётная прибыль / мес</div>
            <div className="font-mono text-3xl font-medium tracking-tight bg-gradient-to-r from-indigo-300 to-pink-300 bg-clip-text text-transparent">
              <AnimatedNumber value={estProfit} format={(v) => Math.round(v).toLocaleString('ru-RU') + ' ₽'} />
            </div>
            <div className="text-[10px] text-zinc-600 mt-1">приблизительно, по введённым данным</div>
          </div>

          <div className="text-[11px] uppercase tracking-wider text-zinc-500 font-medium mb-2">Показатели vs норма</div>
          <div className="h-44 -mx-2">
            <ResponsiveContainer width="100%" height="100%">
              <RadarChart data={radarData} outerRadius="72%">
                <defs>
                  <linearGradient id="radarGrad" x1="0" y1="0" x2="1" y2="1">
                    <stop offset="0%" stopColor="#6366F1" stopOpacity={0.7} />
                    <stop offset="100%" stopColor="#EC4899" stopOpacity={0.7} />
                  </linearGradient>
                </defs>
                <PolarGrid stroke="rgba(255,255,255,0.08)" />
                <PolarAngleAxis dataKey="metric" tick={{ fill: '#71717A', fontSize: 10 }} />
                <Radar dataKey="bench" stroke="rgba(255,255,255,0.15)" fill="rgba(255,255,255,0.04)" strokeDasharray="3 3" />
                <Radar dataKey="actual" stroke="#EC4899" strokeWidth={2} fill="url(#radarGrad)" fillOpacity={0.5} isAnimationActive={true} animationDuration={500}/>
              </RadarChart>
            </ResponsiveContainer>
          </div>

          <div className="text-[11px] uppercase tracking-wider text-zinc-500 font-medium mb-2 mt-2">Косты, %</div>
          <div className="h-32">
            <ResponsiveContainer width="100%" height="100%">
              <BarChart data={barData} margin={{ top: 5, right: 0, left: -25, bottom: 0 }}>
                <defs>
                  <linearGradient id="gradFC" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stopColor="#6366F1"/><stop offset="100%" stopColor="#4F46E5"/></linearGradient>
                  <linearGradient id="gradLC" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stopColor="#A855F7"/><stop offset="100%" stopColor="#7E22CE"/></linearGradient>
                  <linearGradient id="gradDC" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stopColor="#EC4899"/><stop offset="100%" stopColor="#BE185D"/></linearGradient>
                  <linearGradient id="gradRent" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stopColor="#F59E0B"/><stop offset="100%" stopColor="#B45309"/></linearGradient>
                </defs>
                <XAxis dataKey="name" tick={{ fill:'#71717A', fontSize:10 }} axisLine={false} tickLine={false}/>
                <YAxis tick={{ fill:'#71717A', fontSize:9 }} axisLine={false} tickLine={false}/>
                <Tooltip cursor={{ fill:'rgba(255,255,255,0.03)' }}
                  contentStyle={{ background:'#16161D', border:'1px solid rgba(255,255,255,0.1)', borderRadius:'10px', fontSize:'11px' }}/>
                <Bar dataKey="value" radius={[6,6,0,0]} animationDuration={400}>
                  {barData.map((_, i) => <Cell key={i} fill={['url(#gradFC)','url(#gradLC)','url(#gradDC)','url(#gradRent)'][i]} />)}
                </Bar>
              </BarChart>
            </ResponsiveContainer>
          </div>

          <div className="grid grid-cols-2 gap-2 mt-3">
            <div className="px-3 py-2 rounded-lg bg-white/[0.03] border border-white/5">
              <div className="text-[10px] text-zinc-500">Выручка</div>
              <div className="font-mono text-sm">
                <AnimatedNumber value={data.revenue} format={(v) => Math.round(v / 1000).toLocaleString('ru-RU') + 'К ₽'} />
              </div>
            </div>
            <div className="px-3 py-2 rounded-lg bg-white/[0.03] border border-white/5">
              <div className="text-[10px] text-zinc-500">Ср. чек</div>
              <div className="font-mono text-sm">
                <AnimatedNumber value={data.avgCheck} format={(v) => Math.round(v).toLocaleString('ru-RU') + ' ₽'} />
              </div>
            </div>
          </div>
        </>
      )}
    </div>
  );
}

// ============ REPORT GENERATION ============
function generateReport(data, concept) {
  const c = concept;
  const fcMid = (c.benchmarks.foodCost[0] + c.benchmarks.foodCost[1]) / 2;
  const lcMid = (c.benchmarks.laborCost[0] + c.benchmarks.laborCost[1]) / 2;
  const dcMid = (c.benchmarks.drinkCost[0] + c.benchmarks.drinkCost[1]) / 2;

  const status = (val, [lo, hi]) => {
    if (val === 0) return 'unknown';
    if (val < lo - 3) return 'warn';
    if (val <= hi) return 'good';
    if (val <= hi + 3) return 'warn';
    return 'critical';
  };

  const metrics = [
    { key:'foodCost', label:'Фудкост', value:data.foodCost, benchmark:`${c.benchmarks.foodCost[0]}–${c.benchmarks.foodCost[1]}%`,
      delta: data.foodCost - fcMid, status: status(data.foodCost, c.benchmarks.foodCost),
      formula: 'Стоимость продуктов ÷ Выручка × 100. Норма зависит от концепции.', unit:'%' },
    { key:'laborCost', label:'Лейборкост', value:data.laborCost, benchmark:`${c.benchmarks.laborCost[0]}–${c.benchmarks.laborCost[1]}%`,
      delta: data.laborCost - lcMid, status: status(data.laborCost, c.benchmarks.laborCost),
      formula:'(ФОТ + налоги) ÷ Выручка × 100. Включает все смены и доплаты.', unit:'%' },
    { key:'drinkCost', label:'Кост напитков', value:data.drinkCost, benchmark:`${c.benchmarks.drinkCost[0]}–${c.benchmarks.drinkCost[1]}%`,
      delta: data.drinkCost - dcMid, status: status(data.drinkCost, c.benchmarks.drinkCost),
      formula:'Себестоимость напитков ÷ Выручка от напитков × 100.', unit:'%' },
    { key:'wastage', label:'Списания', value:data.wastage, benchmark:'≤ 5%', delta: data.wastage - 3,
      status: data.wastage === 0 ? 'unknown' : data.wastage <= 3 ? 'good' : data.wastage <= 5 ? 'warn' : 'critical',
      formula:'Объём списаний ÷ Объём закупа × 100.', unit:'%' },
    { key:'inventoryGap', label:'Инвентаризация', value:data.inventoryGap, benchmark:'≤ 2%', delta: data.inventoryGap - 1,
      status: data.inventoryGap === 0 ? 'unknown' : data.inventoryGap <= 1 ? 'good' : data.inventoryGap <= 2 ? 'warn' : 'critical',
      formula:'Расхождение факт/учёт по итогам инвентаризации, %.', unit:'%' },
    { key:'avgCheck', label:'Средний чек', value:data.avgCheck, benchmark:'— зависит от позиционирования',
      delta:0, status: data.avgCheck > 0 ? 'good' : 'unknown',
      formula:'Выручка ÷ Кол-во чеков.', unit:' ₽' },
  ];

  const weights = { foodCost:0.25, laborCost:0.25, drinkCost:0.15, wastage:0.15, inventoryGap:0.15, avgCheck:0.05 };
  const subScore = (m) => m.status === 'unknown' ? 70 : m.status === 'good' ? 92 : m.status === 'warn' ? 60 : 30;
  const score = Math.round(metrics.reduce((acc, m) => acc + subScore(m) * (weights[m.key] || 0), 0));

  const anomalies = [];
  if (data.foodCost > c.benchmarks.foodCost[1] + 3) {
    anomalies.push({ level:'critical', title:'Фудкост существенно выше нормы',
      desc:`Текущий показатель ${data.foodCost}% при норме ${c.benchmarks.foodCost.join('–')}% для «${c.name}». Возможные причины: завышенные закупочные цены, неоптимальные техкарты, потери на этапе приёмки или хранения.`,
      action:'Провести ABC-анализ закупок. Пересмотреть техкарты по топ-10 позиций. Ввести двойной контроль приёмки.' });
  } else if (data.foodCost > c.benchmarks.foodCost[1]) {
    anomalies.push({ level:'warn', title:'Фудкост на верхней границе коридора',
      desc:`${data.foodCost}% при коридоре ${c.benchmarks.foodCost.join('–')}%. Допустимо, но создаёт давление на маржу.`,
      action:'Проверить техкарты топ-3 блюд по объёму. Сравнить закупочные цены с альтернативными поставщиками.' });
  }
  if (data.laborCost > c.benchmarks.laborCost[1] + 3) {
    anomalies.push({ level:'critical', title:'Лейборкост превышает норму',
      desc:`${data.laborCost}% при норме ${c.benchmarks.laborCost.join('–')}%. Возможны: избыточный штат на пиковых сменах, несбалансированный график, переработки.`,
      action:'Построить почасовую матрицу загрузки. Сократить смены в low-traffic окнах на 15–25%.' });
  }
  if (data.wastage > 5) {
    anomalies.push({ level:'critical', title:'Списания выше нормы',
      desc:`${data.wastage}% при норме ≤ 5%. Паттерн соответствует неэффективному планированию закупа или порче на хранении.`,
      action:'Внедрить ежедневный отчёт по списаниям с указанием причины. Пересмотреть FIFO-процедуры на складе.' });
  }
  if (data.inventoryGap > 2) {
    anomalies.push({ level:'critical', title:'Расхождение инвентаризации выше нормы',
      desc:`${data.inventoryGap}% при норме ≤ 2%. Паттерн соответствует неучтённым потерям. Источники: ошибки списания, недовложения, неточности в техкартах.`,
      action:'Рекомендуется внеплановая инвентаризация по 5 топ-категориям. Сверить техкарты с фактическим расходом за период.' });
  }
  if (data.discrepancies > 10000) {
    anomalies.push({ level:'warn', title:'Расхождения по чекам',
      desc:`${data.discrepancies.toLocaleString('ru-RU')} ₽ за период. Возможны: ошибки официантов, отменённые заказы, незакрытые столы.`,
      action:'Проверить лог отмен и сторно за период. Ввести двухфакторное подтверждение для крупных отмен.' });
  }
  if (data.drinkCost > c.benchmarks.drinkCost[1] + 3) {
    anomalies.push({ level:'warn', title:'Кост напитков выше нормы',
      desc:`${data.drinkCost}% при норме ${c.benchmarks.drinkCost.join('–')}%. Типичные причины: переливы, неучтённый shot, ошибки в калькуляции.`,
      action:'Установить мерные стаканы на бар. Провести контрольные проливы. Сверить миксологические карты.' });
  }
  if (anomalies.length === 0) {
    anomalies.push({ level:'good', title:'Ключевые метрики в коридоре нормы',
      desc:'Основные показатели соответствуют бенчмаркам выбранной концепции. Сохраняйте текущие операционные практики.',
      action:'Зафиксировать текущие SOP. Установить квартальный мониторинг для раннего выявления отклонений.' });
  }

  const recs = [];
  if (data.foodCost > c.benchmarks.foodCost[1]) {
    const reduce = Math.min(3, data.foodCost - c.benchmarks.foodCost[1]);
    const impact = (data.revenue * reduce) / 100;
    recs.push({ title:`Снижение фудкоста на ${reduce.toFixed(1)}%`,
      detail:'через ABC-анализ закупок, ревизию техкарт и тендер на поставщиков',
      impact: `+${Math.round(impact).toLocaleString('ru-RU')} ₽/мес` });
  }
  if (data.laborCost > c.benchmarks.laborCost[1]) {
    const reduce = Math.min(3, data.laborCost - c.benchmarks.laborCost[1]);
    const impact = (data.revenue * reduce) / 100;
    recs.push({ title:`Оптимизация лейборкоста на ${reduce.toFixed(1)}%`,
      detail:'через почасовую матрицу загрузки и пересмотр графика',
      impact: `+${Math.round(impact).toLocaleString('ru-RU')} ₽/мес` });
  }
  if (data.wastage > 5) {
    const impact = (data.revenue * (data.wastage - 3)) / 100 * 0.4;
    recs.push({ title:'Снижение списаний до целевого уровня',
      detail:'через ежедневный учёт причин и FIFO-процедуры на складе',
      impact: `+${Math.round(impact).toLocaleString('ru-RU')} ₽/мес` });
  }
  if (data.inventoryGap > 2) {
    const impact = (data.revenue * (data.inventoryGap - 1)) / 100;
    recs.push({ title:'Устранение расхождений инвентаризации',
      detail:'через сверку техкарт и внеплановую инвентаризацию',
      impact: `+${Math.round(impact).toLocaleString('ru-RU')} ₽/мес` });
  }
  if (data.avgCheck > 0 && data.avgCheck < 1500) {
    const impact = (data.revenue * 0.05);
    recs.push({ title:'Рост среднего чека через апселл и допсейлинг',
      detail:'обучение персонала рекомендательным скриптам, пересборка меню',
      impact: `+${Math.round(impact).toLocaleString('ru-RU')} ₽/мес` });
  }
  if (recs.length === 0) {
    recs.push({ title:'Поддержание текущих метрик',
      detail:'настройка автоматического мониторинга ключевых показателей',
      impact:'стабильность маржи' });
  }

  return { score, metrics, anomalies, recommendations: recs };
}

// ============ HEALTH SCORE ============
function HealthScore({ score }) {
  const [animScore, setAnimScore] = useState(0);
  useEffect(() => {
    const startTime = performance.now();
    const dur = 1200;
    const tick = (now) => {
      const t = Math.min(1, (now - startTime) / dur);
      const eased = 1 - Math.pow(1 - t, 3);
      setAnimScore(score * eased);
      if (t < 1) requestAnimationFrame(tick);
    };
    requestAnimationFrame(tick);
  }, [score]);

  const r = 80, c = 2 * Math.PI * r;
  const offset = c * (1 - animScore / 100);
  const label = score >= 80 ? 'Отлично' : score >= 65 ? 'Хорошо' : score >= 50 ? 'Внимание' : 'Критично';
  const labelColor = score >= 80 ? 'text-emerald-300' : score >= 65 ? 'text-indigo-300' : score >= 50 ? 'text-amber-300' : 'text-rose-300';

  return (
    <div className="relative grid place-items-center">
      <svg width="200" height="200" viewBox="0 0 200 200" className="-rotate-90">
        <defs>
          <linearGradient id="scoreGrad" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stopColor="#6366F1" />
            <stop offset="100%" stopColor="#EC4899" />
          </linearGradient>
        </defs>
        <circle cx="100" cy="100" r={r} fill="none" stroke="rgba(255,255,255,0.06)" strokeWidth="10"/>
        <circle cx="100" cy="100" r={r} fill="none" stroke="url(#scoreGrad)" strokeWidth="10"
          strokeLinecap="round" strokeDasharray={c} strokeDashoffset={offset}
          style={{ transition:'stroke-dashoffset 0.05s linear', filter:'drop-shadow(0 0 12px rgba(236,72,153,0.4))' }}/>
      </svg>
      <div className="absolute inset-0 grid place-items-center">
        <div className="text-center">
          <div className="font-mono text-5xl font-medium tracking-tight">{Math.round(animScore)}</div>
          <div className={`text-xs mt-1 font-medium ${labelColor}`}>{label}</div>
          <div className="text-[10px] text-zinc-500 mt-0.5 uppercase tracking-widest">health score</div>
        </div>
      </div>
    </div>
  );
}

// ============ WHAT-IF SIMULATOR ============
function WhatIfSimulator({ data, concept }) {
  const [open, setOpen] = useState(false);
  const [adj, setAdj] = useState({ foodCost: 0, laborCost: 0, wastage: 0 });

  if (!data.revenue) return null;

  const baseCost = ((data.foodCost + data.laborCost + (data.rent || 12) + (data.drinkCost * 0.2)) / 100);
  const baseProfit = data.revenue * (1 - baseCost);
  const newCost = ((data.foodCost + adj.foodCost + data.laborCost + adj.laborCost + (data.rent || 12) + (data.drinkCost * 0.2)) / 100);
  const wasteImpact = adj.wastage * (data.revenue / 100) * 0.4;
  const newProfit = data.revenue * (1 - newCost) - wasteImpact;
  const delta = newProfit - baseProfit;

  return (
    <div className="rounded-2xl bg-gradient-to-br from-indigo-500/[0.06] to-pink-500/[0.04] border border-white/10 backdrop-blur-sm overflow-hidden">
      <button onClick={() => setOpen(!open)}
        className="w-full flex items-center gap-3 p-4 hover:bg-white/[0.02] transition-colors">
        <div className="w-9 h-9 rounded-xl bg-gradient-to-br from-indigo-500 to-pink-500 grid place-items-center">
          <I.Sliders size={16} className="text-white"/>
        </div>
        <div className="flex-1 text-left">
          <div className="text-sm font-medium">Что если?</div>
          <div className="text-[11px] text-zinc-500">Симуляция изменения метрик</div>
        </div>
        <I.ChevronDown size={15} className={`text-zinc-500 transition-transform ${open ? 'rotate-180' : ''}`}/>
      </button>
      {open && (
        <div className="px-4 pb-5 fade-up">
          <div className="space-y-4 mt-2">
            {[
              { key:'foodCost', label:'Фудкост', current:data.foodCost, min:-5, max:5, step:0.5, suffix:'%' },
              { key:'laborCost', label:'Лейборкост', current:data.laborCost, min:-5, max:5, step:0.5, suffix:'%' },
              { key:'wastage', label:'Списания', current:data.wastage, min:-5, max:5, step:0.5, suffix:'%' },
            ].map(s => (
              <div key={s.key}>
                <div className="flex items-center justify-between mb-1.5 text-xs">
                  <span className="text-zinc-400">{s.label}</span>
                  <span className="font-mono text-zinc-300">
                    {s.current}{s.suffix} <span className="text-zinc-600">→</span> {(s.current + adj[s.key]).toFixed(1)}{s.suffix}
                    {adj[s.key] !== 0 && (
                      <span className={`ml-2 ${adj[s.key] > 0 ? 'text-rose-300' : 'text-emerald-300'}`}>
                        ({adj[s.key] > 0 ? '+' : ''}{adj[s.key]})
                      </span>
                    )}
                  </span>
                </div>
                <input type="range" min={s.min} max={s.max} step={s.step}
                  value={adj[s.key]} onChange={(e) => setAdj({ ...adj, [s.key]: Number(e.target.value) })}
                  className="w-full"/>
              </div>
            ))}
          </div>
          <div className="mt-5 p-4 rounded-xl bg-white/[0.04] border border-white/10">
            <div className="text-[11px] text-zinc-500 uppercase tracking-wider mb-1">Прогноз прибыли</div>
            <div className="flex items-baseline gap-2">
              <span className="font-mono text-xl font-medium">
                <AnimatedNumber value={newProfit} format={(v) => Math.round(v).toLocaleString('ru-RU') + ' ₽'} duration={300}/>
              </span>
              <span className={`text-xs font-mono ${delta > 0 ? 'text-emerald-300' : delta < 0 ? 'text-rose-300' : 'text-zinc-500'}`}>
                {delta > 0 ? '+' : ''}<AnimatedNumber value={delta} format={(v) => Math.round(v).toLocaleString('ru-RU')} duration={300}/> ₽
              </span>
            </div>
          </div>
        </div>
      )}
    </div>
  );
}

              <ol className="space-y-4">
                {report.recommendations.map((r, i) => (
                  <li key={i} className="flex gap-3 fade-up" style={{animationDelay:`${0.2 + i*0.08}s`}}>
                    <span className="flex-shrink-0 w-6 h-6 rounded-full bg-gradient-to-br from-indigo-500 to-pink-500 grid place-items-center text-[11px] font-mono font-medium">
                      {i + 1}
                    </span>
                    <div className="flex-1">
                      <div className="text-sm font-medium leading-snug">{r.title}</div>
                      <div className="text-[11px] text-zinc-500 mt-0.5 leading-relaxed">{r.detail}</div>
                      <div className="inline-flex items-center gap-1.5 mt-2 px-2 py-0.5 rounded-md bg-emerald-500/10 border border-emerald-500/20">
                        <span className="w-1 h-1 rounded-full bg-emerald-400"></span>
                        <span className="text-[11px] font-mono text-emerald-300">{r.impact}</span>
                      </div>
                    </div>
                  </li>
                ))}
              </ol>
            </div>
          </div>
        </div>

        {/* What-if */}
        <WhatIfSimulator data={data} concept={concept} />

        {/* Toast */}
        {savedToast && (
          <div className="fixed bottom-6 right-6 px-4 py-3 rounded-xl bg-[#1F1F28] border border-white/10 shadow-2xl text-sm flex items-center gap-2.5 fade-up z-50">
            <I.Check size={15} className="text-emerald-400"/>
            <span>
              {savedToast === 'pdf' && 'PDF готов (демо)'}
              {savedToast === 'xlsx' && 'Excel готов (демо)'}
              {savedToast === 'save' && 'Аудит сохранён'}
              {savedToast === 'share' && 'Ссылка скопирована'}
            </span>
          </div>
        )}
      </div>
    </div>
  );
}

// ============ APP ============
function App() {
  const [dark, setDark] = useState(true);
  const [screen, setScreen] = useState('landing');
  const [data, setData] = useState(INITIAL_DATA);
  const [auditCount, setAuditCount] = useState(12847);

  useEffect(() => {
    document.body.classList.toggle('light', !dark);
  }, [dark]);

  const handleStart = () => {
    setScreen('input');
    window.scrollTo({ top: 0, behavior: 'smooth' });
  };

  const handleGenerate = () => {
    setAuditCount(c => c + 1);
    setScreen('report');
    window.scrollTo({ top: 0, behavior: 'smooth' });
  };

  const handleBack = () => {
    if (screen === 'report') setScreen('input');
    else if (screen === 'input') setScreen('landing');
  };

  const handleLogo = () => {
    setScreen('landing');
    window.scrollTo({ top: 0, behavior: 'smooth' });
  };

  const concept = CONCEPTS.find(c => c.id === data.conceptId);

  return (
    <div className={dark ? 'dark min-h-screen' : 'min-h-screen'}>
      {/* Background grain/grid effect */}
      <div className="fixed inset-0 pointer-events-none opacity-[0.04]" style={{
        backgroundImage: `radial-gradient(circle at 1px 1px, rgba(255,255,255,0.5) 1px, transparent 0)`,
        backgroundSize: '32px 32px'
      }}></div>

      <Header dark={dark} setDark={setDark} onLogo={handleLogo}
        showBack={screen !== 'landing'} onBack={handleBack}/>

      {screen === 'landing' && <Landing onStart={handleStart} auditCount={auditCount}/>}
      {screen === 'input' && <InputDashboard data={data} setData={setData} onGenerate={handleGenerate}/>}
      {screen === 'report' && concept && <ReportScreen data={data} concept={concept}/>}

      {/* Footer */}
      <footer className="px-5 lg:px-10 py-6 border-t border-white/5 mt-auto">
        <div className="max-w-7xl mx-auto flex flex-col sm:flex-row items-center justify-between gap-3 text-[11px] text-zinc-600">
          <div className="flex items-center gap-3">
            <span className="font-mono">© 2026 РестАудит</span>
            <span className="hidden sm:inline">·</span>
            <span>AI-рекомендации носят информационный характер и не являются юридической, аудиторской или налоговой консультацией</span>
          </div>
          <div className="flex items-center gap-4">
            <span>v1.0</span>
            <span>Made with</span>
            <span className="bg-gradient-to-r from-indigo-400 to-pink-400 bg-clip-text text-transparent font-medium">♥</span>
          </div>
        </div>
      </footer>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
